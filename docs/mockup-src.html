<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ماکاپ تعاملی — شبکه تبادل خودرو</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:Vazirmatn;font-style:normal;font-weight:400;font-display:swap;src:url(data:font/woff2;base64,__FONT_REGULAR__) format('woff2')}
@font-face{font-family:Vazirmatn;font-style:normal;font-weight:700;font-display:swap;src:url(data:font/woff2;base64,__FONT_BOLD__) format('woff2')}

:root{
  /* اپ */
  --app-bg:#F6F8FA; --surface:#FFFFFF; --ink:#101E2B; --muted:#63748A;
  --line:#E3E9EF; --line-soft:#EFF3F6;
  --navy:#12324F; --accent:#0E7FB8; --accent-soft:#E7F2F9;
  --ok:#15734A; --ok-soft:#E4F1EA; --warn:#9A6612; --warn-soft:#FBF1DF; --danger:#AF3529; --danger-soft:#FAE9E7;
  /* قاب نمایش */
  --stage:#0B141C; --stage-2:#101E29; --stage-ink:#E7EEF4; --stage-muted:#8AA0B2; --stage-line:#243542;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Vazirmatn,Tahoma,sans-serif;background:var(--stage);color:var(--stage-ink);
  background-image:radial-gradient(1200px 600px at 80% -10%,#16293a 0%,transparent 60%),radial-gradient(900px 500px at 0% 100%,#132430 0%,transparent 55%);
  min-height:100vh;line-height:1.85;font-size:15px;overflow-x:hidden
}
h1,h2,h3,h4{margin:0;line-height:1.5;font-weight:700}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}

/* ===== سربرگ ===== */
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.brandmark{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#1E6FA0,#0D3350);display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,127,184,.28)}
.head h1{font-size:19px;letter-spacing:-.02em}
.head .sub{color:var(--stage-muted);font-size:12.5px;margin-top:-4px}
.tag{border:1px solid var(--stage-line);color:var(--stage-muted);border-radius:99px;padding:4px 13px;font-size:11.5px;background:rgba(255,255,255,.03)}

/* ===== انتخاب نقش ===== */
.roles{display:inline-flex;background:rgba(255,255,255,.045);border:1px solid var(--stage-line);border-radius:99px;padding:4px;gap:3px}
.roles button{background:none;border:0;color:var(--stage-muted);font-size:13px;font-weight:700;padding:8px 18px;border-radius:99px;min-height:40px;transition:.2s;white-space:nowrap}
.roles button[aria-selected="true"]{background:var(--stage-ink);color:var(--stage)}
.roles button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== چیدمان ===== */
.stage{display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:start;margin-top:20px}
.stage>*{min-width:0}
@media(max-width:900px){.stage{grid-template-columns:1fr;gap:18px}}

/* فهرست صفحه‌ها */
.steps{display:flex;flex-direction:column;gap:6px}
.steps .lbl{font-size:11px;letter-spacing:.08em;color:var(--stage-muted);margin:4px 2px 6px}
.step{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--stage-line);color:var(--stage-ink);
  border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;text-align:right;min-height:46px;transition:.18s;width:100%}
.step:hover{border-color:#365068;background:rgba(255,255,255,.06)}
.step[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(14,127,184,.25)}
.step .n{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;background:rgba(255,255,255,.1);flex:none}
.step[aria-current="true"] .n{background:rgba(255,255,255,.22)}
@media(max-width:900px){
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps .lbl{display:none}
  .step{white-space:nowrap;width:auto}
}

/* صحنه گوشی */
.viewport{display:flex;flex-direction:column;align-items:center;gap:16px}
.phone{width:378px;max-width:100%;background:#05090d;border-radius:42px;padding:11px;box-shadow:0 40px 80px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07)}
.screen{background:var(--app-bg);border-radius:32px;overflow:hidden;height:748px;display:flex;flex-direction:column;position:relative;color:var(--ink)}
@media(max-width:440px){.phone{width:100%;padding:8px;border-radius:34px}.screen{height:640px;border-radius:26px}.wrap{padding-inline:12px}}

/* نوار وضعیت گوشی */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 3px;font-size:11.5px;color:var(--ink);font-weight:700;flex:none}
.sbar .icons{display:flex;gap:5px;align-items:center;opacity:.8}

/* اپ‌بار */
.appbar{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;flex:none;border-bottom:1px solid var(--line-soft);background:var(--surface)}
.appbar h2{font-size:16px;letter-spacing:-.01em;flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--line-soft)}

/* بدنه اسکرول */
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:13px;background:var(--app-bg)}
.body::-webkit-scrollbar{width:0}

/* اجزا */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tight{padding:12px}
.row{display:flex;align-items:center;gap:11px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.xs{font-size:12px}.sm{font-size:13px}.lg{font-size:17px}
.b{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 11px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.dan{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--line-soft);color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;
  background:var(--navy);color:#fff;font-weight:700;font-size:15px;transition:.18s;padding:0 16px}
.btn:hover{background:#0d2740}
.btn.accent{background:var(--accent)}.btn.accent:hover{background:#0a6d9f}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-soft)}
.btn:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:11px;min-height:46px;display:flex;align-items:center;padding:0 13px;gap:8px;font-size:14px;color:var(--ink)}
.input.ph{color:#9AA9B8}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--ink);min-height:40px;transition:.18s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%;text-align:right;transition:.18s;min-height:64px;color:var(--ink)}
.tile:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(16,30,43,.4)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ic.navy{background:#E8EDF2;color:var(--navy)}
.arrow{color:#B7C3CF;flex:none}
.thumb{width:100%;height:158px;border-radius:11px;background:linear-gradient(160deg,#DCE5EC,#C6D3DE);display:grid;place-items:center;color:#8DA0B1;flex:none}
.thumb.sq{width:74px;height:60px;border-radius:9px}
.divide{height:1px;background:var(--line-soft);margin:2px 0}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700}
.timer{display:flex;align-items:center;gap:9px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 13px;font-weight:700;font-size:13.5px}
.timer .t{margin-inline-start:auto;font-size:16px;letter-spacing:.02em}
.note{background:var(--accent-soft);color:#0b5c86;border-radius:11px;padding:10px 13px;font-size:12.5px}
.bottombar{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:11px 16px 16px;display:flex;flex-direction:column;gap:9px}
.steps-line{display:flex;flex-direction:column;gap:0}
.stepitem{display:flex;gap:11px;align-items:flex-start;padding:2px 0}
.stepitem .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line-soft);color:#9AA9B8;font-size:11px;font-weight:700;position:relative;z-index:1}
.stepitem.done .dot{background:var(--ok);color:#fff}
.stepitem.now .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.stepitem .txt{padding-bottom:14px;flex:1;border-inline-start:2px solid var(--line-soft);margin-inline-start:-14px;padding-inline-start:23px;margin-top:2px}
.stepitem:last-child .txt{border-color:transparent;padding-bottom:0}
.stepitem .t1{font-size:13.5px;font-weight:700}
.stepitem .t2{font-size:11.5px;color:var(--muted)}
.stepitem.wait .t1{color:var(--muted);font-weight:400}
.empty{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding:32px 20px;color:var(--muted)}

/* یادداشت زیر ماکاپ */
.why{width:378px;max-width:100%;background:rgba(255,255,255,.045);border:1px solid var(--stage-line);border-radius:16px;padding:14px 16px}
.why h4{font-size:13px;color:var(--stage-ink);margin-bottom:5px;display:flex;align-items:center;gap:7px}
.why p{margin:0;color:var(--stage-muted);font-size:12.5px;line-height:1.9}
.why .ref{display:inline-block;margin-top:7px;font-size:11px;color:#7FC2E6;background:rgba(14,127,184,.13);border-radius:6px;padding:2px 9px}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--stage-line);color:var(--stage-muted);font-size:12px;text-align:center}

@media (prefers-reduced-motion: no-preference){
  .fade{animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="brandmark">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17V9.5L8 6h8l1.5 3.5V17M6.5 10.5h11"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="17" r="1.6"/></svg>
      </div>
      <div>
        <h1>شبکه تبادل خودرو</h1>
        <div class="sub">ماکاپ تعاملی — نسخه ۱ برای بررسی</div>
      </div>
    </div>
    <div class="row">
      <span class="tag">قابل کلیک — مسیر واقعی معامله</span>
      <div class="roles" role="tablist">
        <button role="tab" aria-selected="true" data-role="dealer">فروشنده نمایندگی</button>
        <button role="tab" aria-selected="false" data-role="central">دفتر مرکزی</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="steps" id="steps"></div>

    <div class="viewport">
      <div class="phone">
        <div class="screen">
          <div class="sbar">
            <span class="num">۱۰:۳۲</span>
            <span class="icons">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h3v-6H2v6zm5.5 0h3V8h-3v12zM13 20h3V4h-3v16zm5.5 0h3v-9h-3v9z"/></svg>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2 9.5C4.5 7 8 5.6 12 5.6S19.5 7 22 9.5l-2 2C18 9.6 15.2 8.5 12 8.5S6 9.6 4 11.5l-2-2zm5 5c1.4-1.4 3.1-2.1 5-2.1s3.6.7 5 2.1l-2 2c-.8-.8-1.9-1.2-3-1.2s-2.2.4-3 1.2l-2-2zM12 21l2.2-2.2c-1.2-1.2-3.2-1.2-4.4 0L12 21z"/></svg>
              <svg width="20" height="15" viewBox="0 0 26 14" fill="none"><rect x="1" y="1" width="21" height="12" rx="3.5" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="3" width="14" height="8" rx="2" fill="currentColor"/><path d="M24 5.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
          </div>
          <div id="app"></div>
        </div>
      </div>

      <div class="why">
        <h4>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7FC2E6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          چرا این صفحه این‌طور طراحی شده؟
        </h4>
        <p id="whyText"></p>
        <span class="ref" id="whyRef"></span>
      </div>
    </div>
  </div>

  <div class="foot">این ماکاپ فقط نمایشی است — هیچ داده واقعی ثبت نمی‌شود. اعداد و اسم‌ها نمونه‌اند.</div>
</div>

<script>
/* ---------------- آیکن‌ها ---------------- */
const I = {
  search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  folder:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  arrow:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  car:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17V9.5L8 6h8l1.5 3.5V17M6.5 10.5h11"/><circle cx="8.5" cy="17" r="1.4"/><circle cx="15.5" cy="17" r="1.4"/></svg>',
  doc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></svg>',
  bell:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 15v-4a6 6 0 1 0-12 0v4l-1.5 2.5h15L18 15zM10 20a2.5 2.5 0 0 0 4 0"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>',
  camera:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8.5A2 2 0 0 1 5 6.5h2l1.2-2h7.6L17 6.5h2a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5z"/><circle cx="12" cy="13" r="3.4"/></svg>',
  check:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"/></svg>',
  bank:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 18h18M12 3l9 5H3l9-5z"/></svg>',
  users:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16.5 6.2a3.2 3.2 0 0 1 0 6M18 18.6c0-2-1-3.4-2.5-4.2"/></svg>',
  chart:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V5M4 19h16M8 19v-6M12.5 19V9M17 19v-4"/></svg>',
  phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l1.5 4-2 1.5a12 12 0 0 0 6 6L16 13l4 1.5V19a1.5 1.5 0 0 1-1.7 1.5A16.5 16.5 0 0 1 3.5 5.7 1.5 1.5 0 0 1 5 4z"/></svg>'
};
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* ---------------- تعریف صفحه‌ها ---------------- */
const SCREENS = {
  /* ===== فروشنده نمایندگی ===== */
  home:{ role:'dealer', label:'خانه', bar:null,
    why:'اولین صفحه‌ای که فروشنده می‌بیند. فقط سه کار اصلی — بدون منو و پیچیدگی. کاربر ما وقت و حوصله یادگیری ندارد؛ هر کار مهم باید یک لمس فاصله داشته باشد.',
    ref:'مبنا: کاربران کم‌تجربه، موبایل‌محور',
    html:`
      <div class="appbar">
        <div style="flex:1">
          <h2>نمایندگی تهران — شعبه ونک</h2>
          <div class="xs muted">علی رضایی · فروشنده</div>
        </div>
        <button class="iconbtn" data-goto="cases" aria-label="اعلان‌ها">${I.bell}</button>
      </div>
      <div class="body">
        <div class="card tight" style="border-color:#F2D9A8;background:var(--warn-soft)">
          <div class="row">
            <span style="color:var(--warn)">${I.clock}</span>
            <div style="flex:1">
              <div class="sm b" style="color:var(--warn)">یک پرونده منتظر بیعانه است</div>
              <div class="xs" style="color:#8a6a2a">تیگو ۸ مشکی — <span class="num" data-timer="42">۴۲:۰۰</span> تا آزاد شدن</div>
            </div>
            <button class="chip" data-goto="deposit" style="min-height:42px;padding:6px 13px">ادامه</button>
          </div>
        </div>

        <button class="tile" data-goto="search">
          <span class="ic">${I.search}</span>
          <span style="flex:1">
            <span class="b" style="display:block">جست‌وجوی خودرو در شبکه</span>
            <span class="xs muted">مشتری چه می‌خواهد؟</span>
          </span>
          <span class="arrow">${I.arrow}</span>
        </button>

        <button class="tile" data-goto="add">
          <span class="ic navy">${I.plus}</span>
          <span style="flex:1">
            <span class="b" style="display:block">ثبت خودرو یا حواله</span>
            <span class="xs muted">موجودی شعبه من</span>
          </span>
          <span class="arrow">${I.arrow}</span>
        </button>

        <button class="tile" data-goto="cases">
          <span class="ic navy">${I.folder}</span>
          <span style="flex:1">
            <span class="b" style="display:block">پرونده‌های من</span>

/* ---------------- اجرا ---------------- */
const app=document.getElementById('app'), stepsEl=document.getElementById('steps');
let role='dealer', current='home';
const ORDER={dealer:['home','search','results','customer','request','reserved','deposit','case','cases','add'],central:['ops','match','score']};

function renderSteps(){
  stepsEl.innerHTML = '<div class="lbl">صفحه‌ها</div>' + ORDER[role].map((k,i)=>
    `<button class="step" data-goto="${k}" ${k===current?'aria-current="true"':''}><span class="n num">${fa(i+1)}</span>${SCREENS[k].label}</button>`
  ).join('');
}
function go(key){
  if(!SCREENS[key])return;
  current=key;
  const s=SCREENS[key];
  if(s.role!==role){role=s.role;document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.role===role)));}
  app.innerHTML=`<div class="fade" style="display:flex;flex-direction:column;flex:1;overflow:hidden">${s.html}</div>`;
  document.getElementById('whyText').textContent=s.why;
  document.getElementById('whyRef').textContent=s.ref||'';
  renderSteps();
  startTimers();
  const b=app.querySelector('.body'); if(b)b.scrollTop=0;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-goto]');
  if(t){go(t.dataset.goto);return;}
  const r=e.target.closest('.roles button');
  if(r){go(ORDER[r.dataset.role][0]);return;}
  const c=e.target.closest('.chip[aria-pressed]');
  if(c){c.parentElement.querySelectorAll('.chip[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed','false'));c.setAttribute('aria-pressed','true');}
});

/* شمارش معکوس واقعی برای حس بهتر */
let tick=null;
function startTimers(){
  clearInterval(tick);
  const els=[...document.querySelectorAll('[data-timer]')];
  if(!els.length)return;
  let secs=els.map(el=>parseInt(el.dataset.timer,10)*60);
  const paint=()=>els.forEach((el,i)=>{
    const s=Math.max(0,secs[i]);
    const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
    el.textContent = fa(h>0 ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`);
  });
  paint();
  tick=setInterval(()=>{secs=secs.map(s=>Math.max(0,s-1));paint();},1000);
}
go('home');
</script>
